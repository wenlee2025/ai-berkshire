name: Daily Market Data Refresh & Deploy

on:
  schedule:
    # 台灣時間週一至週五 16:30 (UTC 08:30) 台股盤後自動執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas openpyxl requests

      - name: Generate Fresh 37 Stocks Dataset
        run: |
          python scripts/generate_full_37_dataset.py

      - name: Commit & Push if Dataset Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/stocks_data.js dashboard/stocks_db.json dashboard/index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): automated daily market dataset update [skip ci]"
            git push origin main
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
